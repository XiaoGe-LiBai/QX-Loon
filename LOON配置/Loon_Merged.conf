# Mitm
# 这里故意留空：各插件会在自己的 [MITM] 段声明需要解密的域名，Loon 会自动合并。
# 不要写成 hostname = -www.google.com（奶思原配置的写法）。只写排除项且没有
# 任何包含项时，等于"除 google 外全部域名都解密"，每个 HTTPS 连接都要在
# Loon 里解密再加密，与第 5 条叠加会明显加重负担。
# 导入后仍需在 App 里重新安装并信任证书。
# =====================================
[Mitm]
hostname = 
ca-p12 =
ca-passphrase =
skip-server-cert-verify = false


# ==============================================================================
# 排障：如果还出现"开久了页面刷不出来"
# ==============================================================================
# 按这个顺序做，能定位到具体环节：
#
# 1. 出问题时立刻看 Loon 的请求列表，先分清卡在哪一步
#    - 请求停在 DNS 阶段 -> DNS 问题。把 General 的 dns-server 改成只用 system，
#      或反过来只留 223.5.5.5，对比一次就能确认
#    - 有目标 IP 但一直等响应 -> 节点/链路问题，走第 2 步
#    - 请求根本没出现 -> 流量没进 Loon，检查 TUN 与 bypass-tun
#
# 2. 优先验证"节点反复切换"这个头号嫌疑
#    出问题时先看 Loon 底部「策略」，盯住地区自动组当前选中的节点。
#    最快的验证办法：把业务组手动锁定到同一个固定节点（如香港手动策略里
#    选一个具体节点），跑半天。如果不卡了，就确认是选路抖动。
#    长期方案是把对应 url-test 组的 interval 改成 0（停止自动测速）。
#
# 3. 验证是不是测速本身在拖
#    可莉默认用 www.gstatic.com 做测速地址，这个域名必须走代理（这是刻意的，
#    测速就是要量代理链路）。所以减负的方向不是换地址，而是降频：
#    把各 url-test 组 interval 调大，或干脆设 0 停止自动测速。
#    注意不要改用国内可直连的地址，那样测的是直连速度，选出来的节点不可靠。
#
# 4. 验证 DNS 泄漏拦截插件
#    Prevent_DNS_Leaks.lpx 会把兜底域名解析重定向到代理，
#    在校园网/双栈环境下偶尔会反复重试。临时把它 enabled 改 false 观察一天。
#
# 5. 验证定时任务是否堆积
#    Remote Script 里的 tasks 与 tools 合集会在后台跑定时任务。
#    把这两行 enabled 改 false 跑一天，能排除脚本因素。
#
# 6. 确认没有双重代理
#    若路由器本身在翻墙，Loon 又开着，等于套两层。
#    这时启用 ssid-trigger 让该 WiFi 走 DIRECT。
#
# 7. 版本相关
#    ip-mode 需要 Loon 3.2.3 (754) 以上。若你的版本更旧，
#    该行会被忽略、IPv6 不生效，请先升级 App。
# ==============================================================================
