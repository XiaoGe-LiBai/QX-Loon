# =====================================
# Mitm
# 这里故意留空：各插件会在自己的 [MITM] 段声明需要解密的域名，Loon 会自动合并。
# 不要写成 hostname = -www.google.com（奶思原配置的写法）。只写排除项且没有
# 任何包含项时，等于"除 google 外全部域名都解密"，每个 HTTPS 连接都要在
# Loon 里解密再加密，与第 5 条叠加会明显加重负担。
# 导入后仍需在 App 里重新安装并信任证书。
# =====================================
[Mitm]
hostname = 
ca-p12 =
ca-passphrase =
skip-server-cert-verify = false


# ==============================================================================
# 排障：开久了页面刷不出来
# ==============================================================================
# 1. 看请求卡在哪：停在 DNS 阶段 -> DNS 问题，把 dns-server 改成只用 system 对比；
#    有目标 IP 但无响应 -> 节点或链路问题；请求根本没出现 -> 检查 TUN 与 bypass-tun。
# 2. 节点频繁切换：把业务组锁到单个固定节点跑半天，不卡即确认是选路抖动，
#    长期方案把对应 url-test 的 interval 调大或设 0 停止自动测速。
# 3. 依次关掉 Prevent_DNS_Leaks 插件、Remote Script 里的两个定时任务，各观察一天。
# 4. ip-mode 需要 Loon 3.2.3 (754) 以上，版本更旧则 IPv6 不生效。
# ==============================================================================
