# =====================================
# Plugin
# 关于 policy= ：插件里的规则只能用 DIRECT / REJECT / PROXY 三种策略。
# 去广告类插件写的是 REJECT，所以不需要 policy。
# 需要联网的功能类插件写的是 PROXY，必须用 policy= 指定走哪个策略组，
# 否则这些域名会按"找不到策略组"的默认逻辑处理。
# =====================================
[Plugin]
